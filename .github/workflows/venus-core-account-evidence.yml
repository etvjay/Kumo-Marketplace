name: Venus Core Account Evidence

on:
  push:
    branches: [main]
    paths:
      - "packages/reference-agents/src/health/**"
      - "scripts/venus-core-account-evidence.mjs"
      - ".github/workflows/venus-core-account-evidence.yml"
  workflow_dispatch:
    inputs:
      account:
        description: "Public Venus Core account to verify"
        required: false
        default: "0x9FBd07c1db2a93b1BB079C6c958DF374EF93fFd9"
      discovery_ref:
        description: "Public discovery evidence reference"
        required: false
        default: "bscscan:tx:0xfee894a1246da889072999415aed1efefd9fdfd3e140f0025b971807cf3737da"

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Verify public Venus Core borrower against finalized BSC state
        env:
          BSC_RPC_URL: https://bsc-dataseed.bnbchain.org
          VENUS_EVIDENCE_ACCOUNT: ${{ inputs.account || '0x9FBd07c1db2a93b1BB079C6c958DF374EF93fFd9' }}
          VENUS_ACCOUNT_DISCOVERY_REF: ${{ inputs.discovery_ref || 'bscscan:tx:0xfee894a1246da889072999415aed1efefd9fdfd3e140f0025b971807cf3737da' }}
          KUMO_EVIDENCE_PATH: evidence/live/venus-core-account-evidence.json
        run: node scripts/venus-core-account-evidence.mjs
      - name: Upload public account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-core-account-evidence-${{ github.sha }}
          path: evidence/live/venus-core-account-evidence.json
          if-no-files-found: error
          retention-days: 30
